[workspace]
resolver = "3"
members = [
    "crates/schema",
    "crates/ir",
    "crates/compiler",
    "crates/verify",
    "crates/runtime",
    "crates/extension",
    "crates/extension-macros",
    "crates/operators",
    "crates/devices",
    "crates/artifact",
    "crates/cli",
]
default-members = ["crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "Apache-2.0"
repository = "https://github.com/Miyamoto-Renya/BCI-lang"

[workspace.dependencies]
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
syn = { version = "=3.0.9", features = ["full"] }
quote = "=1.0.47"
toml = "=1.1.8"
sha2 = "=0.10.9"
bci-schema = { path = "crates/schema" }
bci-ir = { path = "crates/ir" }
bci-compiler = { path = "crates/compiler" }
bci-verify = { path = "crates/verify" }
bci-runtime = { path = "crates/runtime" }
bci-extension = { path = "crates/extension" }
bci-extension-macros = { path = "crates/extension-macros" }
bci-operators = { path = "crates/operators" }
bci-devices = { path = "crates/devices" }
bci-artifact = { path = "crates/artifact" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
overflow-checks = true
